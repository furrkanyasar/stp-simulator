      return standard === 'short' ? (SHORT_COST[speed] || 19) : (LONG_COST[speed] || 200000);
    }

      if (aPri !== bPri) return aPri - bPri;
      return aMac.localeCompare(bMac);

          { id: 'a3-pc2', name: 'Gi0/2', switchId: 'a3', priority: 128, portNumber: 2, role: 'DISABLED', state: 'DISABLED', connectedLinkId: 'l-c2a3' },
        ],
        links: [
          { id: 'l-c1c2', switchAId: 'c1', portAId: 'c1-p0', switchBId: 'c2', portBId: 'c2-p0', speed: '10G', cost: 2, status: 'UP' },
          { id: 'l-c1a1', switchAId: 'c1', portAId: 'c1-pa1', switchBId: 'a1', portBId: 'a1-pc1', speed: '1G', cost: 4, status: 'UP' },
          { id: 'l-c1a2', switchAId: 'c1', portAId: 'c1-pa2', switchBId: 'a2', portBId: 'a2-pc1', speed: '1G', cost: 4, status: 'UP' },
          { id: 'l-c1a3', switchAId: 'c1', portAId: 'c1-pa3', switchBId: 'a3', portBId: 'a3-pc1', speed: '1G', cost: 4, status: 'UP' },
          { id: 'l-c2a1', switchAId: 'c2', portAId: 'c2-pa1', switchBId: 'a1', portBId: 'a1-pc2', speed: '1G', cost: 4, status: 'UP' },
          { id: 'l-c2a2', switchAId: 'c2', portAId: 'c2-pa2', switchBId: 'a2', portBId: 'a2-pc2', speed: '1G', cost: 4, status: 'UP' },
          { id: 'l-c2a3', switchAId: 'c2', portAId: 'c2-pa3', switchBId: 'a3', portBId: 'a3-pc2', speed: '1G', cost: 4, status: 'UP' },
        ]
      }
    ];

    function calculateSTPConvergence(switchesInput, portsInput, linksInput, stpVersion, costStandard) {
      const switches = new Map();
      const ports = new Map();
      const links = new Map();

      switchesInput.forEach(s => switches.set(s.id, { ...s, isRoot: false, rootPathCost: Infinity, rootPortId: null }));
      portsInput.forEach(p => ports.set(p.id, { ...p, role: 'DISABLED', state: 'DISABLED' }));
      linksInput.forEach(l => {
        const cost = l.customCost !== undefined && l.customCost > 0 ? l.customCost : getLinkCost(l.speed, costStandard);
        links.set(l.id, { ...l, cost });
      });

      const logs = [];
      const stepByStepLogs = [];
      let stepCounter = 1;

      function addLog(category, enMsg, trMsg) {
        const timeStr = new Date().toLocaleTimeString('tr-TR', { hour12: false });
        const entry = { id: `log-${stepCounter++}`, timestamp: timeStr, category, messageEn: enMsg, messageTr: trMsg };
        logs.push(entry);
        stepByStepLogs.push([...logs]);
      }

      addLog('ENGINE', `Initializing ${stpVersion} convergence calculation (${costStandard.toUpperCase()})...`, `${stpVersion} yakınsama hesaplaması başlatılıyor (${costStandard.toUpperCase()})...`);

      if (stpVersion === '802.1D') {
        addLog('ENGINE', '802.1D Classic STP Timers Active: Max Age = 20s, Hello = 2s, Forward Delay = 15s (30s Total Convergence Delay).', '802.1D Klasik STP Zamanlayıcıları Aktif: Max Age = 20s, Hello = 2s, Forward Delay = 15s (Toplam 30sn Yakınsama Gecikmesi).');
      } else if (stpVersion === '802.1w') {
        addLog('ENGINE', '802.1w RSTP Rapid Convergence Active: Proposal/Agreement (P/A) Handshake Sync Enabled (~2s Rapid Rerouting).', '802.1w RSTP Hızlı Yakınsama Aktif: Proposal/Agreement (P/A) El Sıkışması Etkin (~2sn Anlık Rota Değişimi).');
      } else if (stpVersion === '802.1s') {
        addLog('ENGINE', '802.1s MSTP Multi-Instance Active: Region \'NOC-MST-1\', Rev 1. Mapping VLAN 1-4094 to MST0 (CIST).', '802.1s MSTP Çoklu Örneklem Aktif: Bölge \'NOC-MST-1\', Rev 1. VLAN 1-4094 MST0 (CIST) Örneğine Eşlendi.');
      }

      if (switches.size === 0) return { switches, ports, links, rootSwitchId: null, logs, stepByStepLogs };

      let rootSwitch = null;
      switches.forEach(sw => {
        if (!rootSwitch) rootSwitch = sw;
        else if (compareBridgeId(sw.priority, sw.mac, rootSwitch.priority, rootSwitch.mac) < 0) rootSwitch = sw;
      });

      const rootId = rootSwitch.id;
      const rootObj = switches.get(rootId);
      rootObj.isRoot = true;
      rootObj.rootPathCost = 0;

      addLog('ROOT', `Switch ${rootObj.name} selected as ROOT BRIDGE (Lowest BID: ${formatBridgeId(rootObj.priority, rootObj.mac)}).`, `${rootObj.name} anahtarı KÖK KÖPRÜ seçildi (En Düşük BID: ${formatBridgeId(rootObj.priority, rootObj.mac)}).`);

      const distances = new Map();
      switches.forEach((sw, id) => distances.set(id, { cost: id === rootId ? 0 : Infinity, neighborId: null }));

      let changed = true;
      let maxIter = 30;
      while (changed && maxIter-- > 0) {
        changed = false;
        links.forEach(link => {
          if (link.status !== 'UP') return;
          const pA = ports.get(link.portAId);
          const pB = ports.get(link.portBId);
          if (!pA || !pB) return;

          const swAId = pA.switchId;
          const swBId = pB.switchId;
          const distA = distances.get(swAId);
          const distB = distances.get(swBId);

          if (distA.cost !== Infinity) {
            const pot = distA.cost + link.cost;
            if (pot < distB.cost) {
              distances.set(swBId, { cost: pot, neighborId: swAId });
              changed = true;
            }
          }
          if (distB.cost !== Infinity) {
            const pot = distB.cost + link.cost;
            if (pot < distA.cost) {
              distances.set(swAId, { cost: pot, neighborId: swBId });
              changed = true;
            }
          }
        });
      }

      switches.forEach((sw, swId) => {
        if (swId !== rootId) {
          sw.rootPathCost = distances.get(swId).cost;
          addLog('COST', `${sw.name} calculated Root Path Cost = ${sw.rootPathCost}`, `${sw.name} Kök Yol Maliyeti = ${sw.rootPathCost}`);
        }
      });

      // Root Port (RP)
      switches.forEach((sw, swId) => {
        if (swId === rootId) return;
        const candidates = [];
        ports.forEach(p => {
          if (p.switchId !== swId || !p.connectedLinkId) return;
          const link = links.get(p.connectedLinkId);
          if (!link || link.status !== 'UP') return;

          const otherPortId = link.portAId === p.id ? link.portBId : link.portAId;
          const otherPort = ports.get(otherPortId);
          if (!otherPort) return;
          const senderSw = switches.get(otherPort.switchId);
          const senderDist = distances.get(senderSw.id);
          if (senderDist.cost === Infinity) return;

          candidates.push({ port: p, totalCost: senderDist.cost + link.cost, senderSw, senderPort: otherPort });
        });

        if (candidates.length === 0) return;
        candidates.sort((a, b) => {
          if (a.totalCost !== b.totalCost) return a.totalCost - b.totalCost;
          const cmp = compareBridgeId(a.senderSw.priority, a.senderSw.mac, b.senderSw.priority, b.senderSw.mac);
          if (cmp !== 0) return cmp;
          if (a.senderPort.priority !== b.senderPort.priority) return a.senderPort.priority - b.senderPort.priority;
          return a.senderPort.portNumber - b.senderPort.portNumber;
        });

        const winRP = candidates[0];
        winRP.port.role = 'ROOT';
        winRP.port.state = 'FORWARDING';
        sw.rootPortId = winRP.port.id;
        const roleTag = stpVersion === '802.1s' ? 'ROOT PORT (MST0/CIST) [RP-M0]' : 'ROOT PORT [RP]';
        addLog('ROLE', `${sw.name}:${winRP.port.name} designated as ${roleTag}.`, `${sw.name}:${winRP.port.name} ${roleTag} olarak belirlendi.`);
      });

      // Designated (DP) & Alternate (AP)
      links.forEach(link => {
        if (link.status !== 'UP') return;
        const pA = ports.get(link.portAId);
        const pB = ports.get(link.portBId);
        if (!pA || !pB) return;
        const swA = switches.get(pA.switchId);
        const swB = switches.get(pB.switchId);

        if (pA.role === 'ROOT') {
          pB.role = 'DESIGNATED'; pB.state = 'FORWARDING'; return;
        }
        if (pB.role === 'ROOT') {
          pA.role = 'DESIGNATED'; pA.state = 'FORWARDING'; return;
        }

        let winner = 'A';
        if (swA.rootPathCost !== swB.rootPathCost) {
          winner = swA.rootPathCost < swB.rootPathCost ? 'A' : 'B';
        } else {
          winner = compareBridgeId(swA.priority, swA.mac, swB.priority, swB.mac) < 0 ? 'A' : 'B';
        }

        const dpPort = winner === 'A' ? pA : pB;
        const blockPort = winner === 'A' ? pB : pA;
        const dpSw = winner === 'A' ? swA : swB;
        const blockSw = winner === 'A' ? swB : swA;

        dpPort.role = 'DESIGNATED'; dpPort.state = 'FORWARDING';
        blockPort.role = 'ALTERNATE'; blockPort.state = stpVersion === '802.1D' ? 'BLOCKING' : 'DISCARDING';

        const versionDesc = stpVersion === '802.1D' ? 'BLOCKING state (15s Forwarding Delay timer)' : stpVersion === '802.1w' ? 'DISCARDING state (Immediate RSTP P/A cutoff)' : 'DISCARDING state (MST0/CIST Instance blocking)';
        const versionDescTr = stpVersion === '802.1D' ? 'BLOCKING durumuna (15sn İletim Gecikmesi zamanlayıcısı)' : stpVersion === '802.1w' ? 'DISCARDING durumuna (Anlık RSTP P/A kesintisi)' : 'DISCARDING durumuna (MST0/CIST Örneklem engellemesi)';

        addLog('BLOCK', `${dpSw.name}:${dpPort.name} set to [DP]. ${blockSw.name}:${blockPort.name} placed in ALTERNATE / ${versionDesc} to break loop.`, `${dpSw.name}:${dpPort.name} [DP] yapıldı. ${blockSw.name}:${blockPort.name} döngüyü kırmak için ALTERNATİF / ${versionDescTr} alındı.`);
      });

      ports.forEach(p => {
        if (p.switchId === rootId && p.connectedLinkId) {
          const l = links.get(p.connectedLinkId);
          if (l && l.status === 'UP') {
            p.role = 'DESIGNATED'; p.state = 'FORWARDING';
          }
        }
      });

      addLog('ENGINE', `Convergence complete for ${stpVersion}. Root: ${rootObj.name}.`, `${stpVersion} yakınsaması tamamlandı. Kök: ${rootObj.name}.`);

      return { switches, ports, links, rootSwitchId: rootId, logs, stepByStepLogs };
    }

    function App() {
      const [stpVersion, setStpVersion] = useState('802.1w');
      const [costStandard, setCostStandard] = useState('long');
      const [lang, setLang] = useState('en');
      const [wiringMode, setWiringMode] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(1.0);
      const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [recalcNonce, setRecalcNonce] = useState(0);

      // Tour Modal State
      const [isTourOpen, setIsTourOpen] = useState(false);
      const [tourStep, setTourStep] = useState(0);

      // Modals and Filtering State
      const [isTimersOpen, setIsTimersOpen] = useState(false);
      const [bpduModalLink, setBpduModalLink] = useState(null);
      const [syslogFilter, setSyslogFilter] = useState('ALL');
      const [stpTimers, setStpTimers] = useState({ maxAge: 20, helloTime: 2, forwardDelay: 15 });

      // Real-Time Operator Action Logs
      const [operatorLogs, setOperatorLogs] = useState([]);
      const logsContainerRef = useRef(null);

      const t = I18N[lang] || I18N.en;

      const preset = PRESETS[1]; // Default 3-switch triangle
      const [switchesList, setSwitchesList] = useState(preset.switches);
      const [portsList, setPortsList] = useState(preset.ports);
      const [linksList, setLinksList] = useState(preset.links);

      const [inspectorSwitch, setInspectorSwitch] = useState(null);
      const [inspectorLink, setInspectorLink] = useState(null);

      // Modal Form State for Link Inspector
      const [modalLinkStatus, setModalLinkStatus] = useState('UP');
      const [modalLinkSpeed, setModalLinkSpeed] = useState('100M');
      const [modalCustomCost, setModalCustomCost] = useState('');

      useEffect(() => {
        if (inspectorLink) {
          setModalLinkStatus(inspectorLink.status || 'UP');
          setModalLinkSpeed(inspectorLink.speed || '100M');
          setModalCustomCost(inspectorLink.customCost !== undefined ? String(inspectorLink.customCost) : '');
        }
      }, [inspectorLink]);

      const [wiringSourcePortId, setWiringSourcePortId] = useState(null);
      const [portModalSwitchId, setPortModalSwitchId] = useState(null);
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

      const canvasRef = useRef(null);
      const [draggingId, setDraggingId] = useState(null);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });

      const addOperatorLog = useCallback((category, messageEn, messageTr) => {
        const timeStr = new Date().toLocaleTimeString('tr-TR', { hour12: false });
        const entry = {
          id: `op-log-${Date.now()}-${Math.random().toString(36).substring(2, 5)}`,
          timestamp: timeStr,
          category,
          messageEn,
          messageTr,
        };
        setOperatorLogs(prev => [...prev, entry]);
      }, []);

      const handleSetStpVersion = (v) => {
        setStpVersion(v);
        if (v === '802.1D') {
          setCostStandard('short');
          addOperatorLog('COST', '802.1D Classic STP selected: Auto-switched Path Cost standard to IEEE Short 16-bit (1G = 4, 100M = 19).', '802.1D Klasik STP seçildi: Yol Maliyeti standardı otomatik olarak IEEE Kısa 16-bit yapıldı (1G = 4, 100M = 19).');
        } else {
          setCostStandard('long');
          addOperatorLog('COST', `${v} selected: Auto-switched Path Cost standard to IEEE 802.1t Long 32-bit (1G = 20000, 100M = 200000).`, `${v} seçildi: Yol Maliyeti standardı otomatik olarak IEEE 802.1t Uzun 32-bit yapıldı (1G = 20000, 100M = 200000).`);
        }
      };

      const getConnectedTargetInfo = (port) => {
        if (!port.connectedLinkId) return null;
        const l = linksList.find(lk => lk.id === port.connectedLinkId);
        if (!l) return null;
        const otherPortId = l.portAId === port.id ? l.portBId : l.portAId;
        const otherPort = portsList.find(pt => pt.id === otherPortId);
        if (!otherPort) return null;
        const otherSw = switchesList.find(sw => sw.id === otherPort.switchId);
        return `${otherSw?.name || 'SW'}:${otherPort.name}`;
      };

      const convergence = useMemo(() => {
        const baseCalc = calculateSTPConvergence(switchesList, portsList, linksList, stpVersion, costStandard);
        return {
          ...baseCalc,
          logs: [...baseCalc.logs, ...operatorLogs]
        };
      }, [switchesList, portsList, linksList, stpVersion, costStandard, recalcNonce, operatorLogs]);

      useEffect(() => {
        if (logsContainerRef.current) {
          logsContainerRef.current.scrollTop = logsContainerRef.current.scrollHeight;
        }
      }, [convergence.logs.length]);

      const handleAddSwitch = () => {
        const nextIdx = switchesList.length + 1;
        const newSwId = `sw-${Date.now()}`;
        const hexMac = nextIdx.toString(16).padStart(2, '0');
        const swName = `SW-${nextIdx}`;
        const newMac = `00:50:56:A1:B2:${hexMac}`;
        const newSw = {
          id: newSwId,
          name: swName,
          priority: 32768,
          mac: newMac,
          vlan: 1,
          x: 280 + (nextIdx % 3) * 70,
          y: 180 + (nextIdx % 2) * 70,
          isRoot: false,
          rootPathCost: Infinity,
          rootPortId: null
        };
        const p1 = { id: `${newSwId}-p1`, name: 'Gi0/1', switchId: newSwId, priority: 128, portNumber: 1, role: 'DISABLED', state: 'DISABLED', connectedLinkId: null };
        const p2 = { id: `${newSwId}-p2`, name: 'Gi0/2', switchId: newSwId, priority: 128, portNumber: 2, role: 'DISABLED', state: 'DISABLED', connectedLinkId: null };

        setSwitchesList(prev => [...prev, newSw]);
        setPortsList(prev => [...prev, p1, p2]);
        addOperatorLog('ACTION', `Added new switch ${swName} (Priority: 32768, MAC: ${newMac}).`, `Yeni anahtar eklendi: ${swName} (Öncelik: 32768, MAC: ${newMac}).`);
      };

      const handleDeleteSwitch = (switchId) => {
        const sw = switchesList.find(s => s.id === switchId);
        const swPorts = portsList.filter(p => p.switchId === switchId).map(p => p.id);
        setLinksList(prev => prev.filter(l => !swPorts.includes(l.portAId) && !swPorts.includes(l.portBId)));
        setPortsList(prev => prev.filter(p => p.switchId !== switchId));
        setSwitchesList(prev => prev.filter(s => s.id !== switchId));
        addOperatorLog('ACTION', `Deleted switch ${sw?.name || switchId}.`, `${sw?.name || switchId} anahtarı silindi.`);
      };

      const handleDeleteLink = (linkId) => {
        setLinksList(prev => prev.filter(l => l.id !== linkId));
        setPortsList(prev => prev.map(p => p.connectedLinkId === linkId ? { ...p, connectedLinkId: null } : p));
        addOperatorLog('ACTION', `Deleted cable link ${linkId}.`, `${linkId} kablo bağlantısı silindi.`);
      };

      const handleConnectPorts = (pAId, pBId) => {
        let pA = portsList.find(p => p.id === pAId);
        let pB = portsList.find(p => p.id === pBId);
        if (!pA || !pB || pA.switchId === pB.switchId) return;

        const swA = switchesList.find(s => s.id === pA.switchId);
        const swB = switchesList.find(s => s.id === pB.switchId);

        let targetAId = pA.id;
        let targetBId = pB.id;
        let updatedPorts = [...portsList];

        if (pA.connectedLinkId) {
          const freeA = updatedPorts.find(p => p.switchId === pA.switchId && !p.connectedLinkId && p.id !== pA.id);
          if (freeA) targetAId = freeA.id;
          else {
            const nextNum = updatedPorts.filter(p => p.switchId === pA.switchId).length + 1;
            targetAId = `${pA.switchId}-p${nextNum}-${Date.now()}`;
            updatedPorts.push({ id: targetAId, name: `Gi0/${nextNum}`, switchId: pA.switchId, priority: 128, portNumber: nextNum, role: 'DISABLED', state: 'DISABLED', connectedLinkId: null });
          }
        }

        if (pB.connectedLinkId) {
          const freeB = updatedPorts.find(p => p.switchId === pB.switchId && !p.connectedLinkId && p.id !== pB.id);
          if (freeB) targetBId = freeB.id;
          else {
            const nextNum = updatedPorts.filter(p => p.switchId === pB.switchId).length + 1;
            targetBId = `${pB.switchId}-p${nextNum}-${Date.now()}`;
            updatedPorts.push({ id: targetBId, name: `Gi0/${nextNum}`, switchId: pB.switchId, priority: 128, portNumber: nextNum, role: 'DISABLED', state: 'DISABLED', connectedLinkId: null });
          }
        }

        const finalPortA = updatedPorts.find(p => p.id === targetAId);
        const finalPortB = updatedPorts.find(p => p.id === targetBId);

        const newLinkId = `link-${Date.now()}`;
        const newLink = { id: newLinkId, switchAId: pA.switchId, portAId: targetAId, switchBId: pB.switchId, portBId: targetBId, speed: '100M', cost: 19, status: 'UP' };

        setLinksList(prev => [...prev, newLink]);
        setPortsList(updatedPorts.map(p => (p.id === targetAId || p.id === targetBId) ? { ...p, connectedLinkId: newLinkId } : p));
        addOperatorLog('ACTION', `Connected cable from ${swA?.name}:${finalPortA?.name} to ${swB?.name}:${finalPortB?.name}.`, `${swA?.name}:${finalPortA?.name} ile ${swB?.name}:${finalPortB?.name} arasına kablo bağlandı.`);
      };

      const handleDisconnectPort = (portId) => {
        const p = portsList.find(pt => pt.id === portId);
        if (!p || !p.connectedLinkId) return;
        const sw = switchesList.find(s => s.id === p.switchId);
        const linkId = p.connectedLinkId;
        setLinksList(prev => prev.filter(l => l.id !== linkId));
        setPortsList(prev => prev.map(pt => pt.connectedLinkId === linkId ? { ...pt, connectedLinkId: null } : pt));
        addOperatorLog('ACTION', `Disconnected cable on port ${sw?.name}:${p.name}.`, `${sw?.name}:${p.name} portundaki kablo söküldü.`);
      };

      const handleSaveLinkModal = () => {
        if (!inspectorLink) return;
        const parsedCost = modalCustomCost.trim() !== '' ? Number(modalCustomCost) : undefined;
        const finalCost = parsedCost && !isNaN(parsedCost) && parsedCost > 0 ? parsedCost : undefined;

        setLinksList(prev => prev.map(l => l.id === inspectorLink.id ? { ...l, status: modalLinkStatus, speed: modalLinkSpeed, customCost: finalCost } : l));

        if (modalLinkStatus === 'DOWN') {
          addOperatorLog('ACTION', `Link ${inspectorLink.id} set to LINK DOWN (Shutdown). Alternate path failover triggered!`, `Hat ${inspectorLink.id} KESİLDİ (LINK DOWN / Shutdown). Alternatif rota yakınsaması tetiklendi!`);
        } else {
          addOperatorLog('ACTION', `Link ${inspectorLink.id} restored to LINK UP. Speed: ${modalLinkSpeed}.`, `Hat ${inspectorLink.id} AKTİF yapıldı (LINK UP). Hız: ${modalLinkSpeed}.`);
        }

        setInspectorLink(null);
      };

      const handleMouseDownCanvas = (e) => {
        if (e.button === 0 && !draggingId) {
          setIsPanning(true);
          setPanStart({ x: e.clientX - panOffset.x, y: e.clientY - panOffset.y });
        }
      };

      const handleMouseMove = (e) => {
        if (canvasRef.current && wiringMode && wiringSourcePortId) {
          const rect = canvasRef.current.getBoundingClientRect();
          setMousePos({ x: (e.clientX - rect.left - panOffset.x) / zoomLevel, y: (e.clientY - rect.top - panOffset.y) / zoomLevel });
        }
      };

      React.useEffect(() => {
        const handleGlobalMouseMove = (e) => {
          if (isPanning) {
            setPanOffset({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
          } else if (draggingId && !wiringMode) {
            const newX = (e.clientX - panOffset.x) / zoomLevel - dragOffset.x;
            const newY = (e.clientY - panOffset.y) / zoomLevel - dragOffset.y;
            setSwitchesList(prev => prev.map(s => s.id === draggingId ? { ...s, x: Math.round(newX), y: Math.round(newY) } : s));
          }
        };
        const handleGlobalMouseUp = () => {
          setIsPanning(false);
          setDraggingId(null);
        };
        if (isPanning || draggingId) {
          window.addEventListener('mousemove', handleGlobalMouseMove);
          window.addEventListener('mouseup', handleGlobalMouseUp);
          return () => {
            window.removeEventListener('mousemove', handleGlobalMouseMove);
            window.removeEventListener('mouseup', handleGlobalMouseUp);
          };
        }
      }, [isPanning, draggingId, panStart, dragOffset, panOffset, zoomLevel, wiringMode]);

      const getPortCoords = (port) => {
        const sw = convergence.switches.get(port.switchId);
        if (!sw) return { x: 0, y: 0 };
        const swPorts = Array.from(convergence.ports.values()).filter(p => p.switchId === sw.id);
        const idx = swPorts.findIndex(p => p.id === port.id);

        const col = idx % 2;
        const row = Math.floor(idx / 2);

        return { x: sw.x + (col === 0 ? 50 : 145), y: sw.y + 76 + row * 26 };
      };

      const handleSelectPortInModal = (portId) => {
        if (!wiringSourcePortId) {
          setWiringSourcePortId(portId);
          setPortModalSwitchId(null);
        } else {
          handleConnectPorts(wiringSourcePortId, portId);
          setWiringSourcePortId(null);
          setPortModalSwitchId(null);
        }
      };

      const tourSteps = [
        { title: t.tourStep1Title, desc: t.tourStep1Desc },
        { title: t.tourStep2Title, desc: t.tourStep2Desc },
        { title: t.tourStep3Title, desc: t.tourStep3Desc },
        { title: t.tourStep4Title, desc: t.tourStep4Desc },
        { title: t.tourStep5Title, desc: t.tourStep5Desc },
        { title: t.tourStep6Title, desc: t.tourStep6Desc },
        { title: t.tourStep7Title, desc: t.tourStep7Desc },
        { title: t.tourStep8Title, desc: t.tourStep8Desc },
      ];

      const protocolBadgeText = stpVersion === '802.1D' ? '802.1D ⏱️ 30s' : stpVersion === '802.1w' ? '802.1w ⚡ 2s' : '802.1s 🌐 MST0';

      return (
        <div className="flex flex-col h-screen w-screen bg-[#0b0f19] text-slate-100 overflow-hidden font-sans">
          {/* Header */}
          <header className="h-[44px] bg-[#0d1322] border-b border-[#1f293d] flex items-center justify-between px-3 shrink-0 select-none text-xs text-slate-200 overflow-hidden">
            <div className="flex items-center space-x-1.5 font-bold text-cyan-400 shrink-0">
              <span className="text-sm">⚡</span>
              <span className="text-slate-100 font-mono text-xs uppercase tracking-wider">STP <span className="text-cyan-400 font-normal">Simulator</span></span>
            </div>

            <div className="flex items-center space-x-1.5 shrink-0">
              {/* Version Selector */}
              <div className="flex items-center bg-[#111827] border border-[#1f293d] px-1.5 py-0.5 h-7 rounded shrink-0">
                <span className="text-slate-400 mr-1 text-[10px]">{t.version}:</span>
                <button onClick={() => handleSetStpVersion('802.1D')} title={t.stpClassic} className={`px-1.5 py-0.5 rounded text-[10px] font-mono h-5 flex items-center shrink-0 ${stpVersion === '802.1D' ? 'bg-cyan-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'}`}>802.1D</button>
                <button onClick={() => handleSetStpVersion('802.1w')} title={t.stpRapid} className={`px-1.5 py-0.5 rounded text-[10px] font-mono h-5 flex items-center shrink-0 ${stpVersion === '802.1w' ? 'bg-cyan-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'}`}>802.1w (RSTP)</button>
                <button onClick={() => handleSetStpVersion('802.1s')} title={t.stpMultiple} className={`px-1.5 py-0.5 rounded text-[10px] font-mono h-5 flex items-center shrink-0 ${stpVersion === '802.1s' ? 'bg-cyan-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'}`}>802.1s (MSTP)</button>
              </div>

              {/* Cost Standard Toggle */}
              <div className="flex items-center space-x-0.5 bg-[#111827] border border-[#1f293d] px-1.5 py-0.5 h-7 rounded shrink-0">
                <span className="text-slate-400 font-mono mr-1 text-[10px]">{t.costModel}:</span>
                <button onClick={() => setCostStandard('short')} className={`px-1.5 py-0.5 rounded font-mono text-[10px] h-5 flex items-center shrink-0 ${costStandard === 'short' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}>Short</button>
                <button onClick={() => setCostStandard('long')} className={`px-1.5 py-0.5 rounded font-mono text-[10px] h-5 flex items-center shrink-0 ${costStandard === 'long' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}>Long</button>
              </div>

              <select onChange={(e) => {
                const p = PRESETS.find(pr => pr.id === e.target.value);
                if (p) { setSwitchesList(p.switches); setPortsList(p.ports); setLinksList(p.links); }
              }} className="bg-[#111827] border border-[#1f293d] text-slate-200 px-1.5 py-0.5 h-7 rounded shrink-0 font-mono text-[10px] max-w-[130px]">
                {PRESETS.map(p => <option key={p.id} value={p.id}>{lang === 'tr' ? p.nameTr : p.nameEn}</option>)}
              </select>

              <button onClick={handleAddSwitch} className="px-2 py-0.5 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium text-[11px] shrink-0">{t.addSwitch}</button>
              <button onClick={() => { addOperatorLog('ENGINE', 'Manual convergence recalculation triggered by NOC operator.', 'NOC operatörü tarafından manuel yakınsama tetiklendi.'); setSwitchesList([...switchesList]); }} className="px-2 py-0.5 h-7 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-medium text-[11px] shrink-0">{t.recalculate}</button>
              <button onClick={() => setIsTimersOpen(true)} className="px-2 py-0.5 h-7 bg-violet-600/80 hover:bg-violet-600 text-violet-50 rounded border border-violet-500/50 font-mono font-medium transition-all text-[11px] shrink-0" title="STP Timers">
                ⏱️ {lang === 'tr' ? 'Zamanlayıcılar' : 'Timers'}
              </button>
              <button onClick={() => setIsTourOpen(true)} className="px-2 py-0.5 h-7 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded font-bold text-[11px] shrink-0">{t.helpButton}</button>

              <div className="flex bg-[#111827] border border-[#1f293d] rounded p-0.5 h-7 shrink-0">
                <button onClick={() => setLang('en')} className={`px-1.5 py-0.5 rounded text-[10px] h-5 flex items-center ${lang === 'en' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>EN</button>
                <button onClick={() => setLang('tr')} className={`px-1.5 py-0.5 rounded text-[10px] h-5 flex items-center ${lang === 'tr' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>TR</button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <div className="flex-1 flex overflow-hidden">
            <div
              ref={canvasRef}
              onMouseDown={handleMouseDownCanvas}
              onMouseMove={handleMouseMove}
              onMouseUp={() => { setIsPanning(false); setDraggingId(null); }}
              onWheel={(e) => {
                e.preventDefault();
                setZoomLevel(prev => Math.max(0.4, Math.min(2.2, Number((prev + (e.deltaY < 0 ? 0.1 : -0.1)).toFixed(2)))));
              }}
              className={`w-[65%] h-full relative bg-[#0b0f19] overflow-hidden select-none border-r border-[#1f293d] ${isPanning ? 'cursor-grabbing' : 'cursor-grab'}`}
              style={{
                backgroundImage: 'radial-gradient(#1f293d 1px, transparent 1px)',
                backgroundSize: `${24 * zoomLevel}px ${24 * zoomLevel}px`,
                backgroundPosition: `${panOffset.x}px ${panOffset.y}px`
              }}
            >
              {/* Zoom Toolbar Overlay */}
              <div className="absolute top-2 right-3 z-30 flex items-center space-x-1 bg-[#111827] border border-[#1f293d] rounded p-1 font-mono text-xs shadow-lg">
                <button onClick={() => setZoomLevel(prev => Math.max(0.4, Number((prev - 0.1).toFixed(2))))} className="px-2 py-0.5 bg-[#1e293b] hover:bg-[#334155] rounded text-slate-200">{t.zoomOut}</button>
                <span className="px-2 text-cyan-400 font-bold">{Math.round(zoomLevel * 100)}%</span>
                <button onClick={() => setZoomLevel(prev => Math.min(2.2, Number((prev + 0.1).toFixed(2))))} className="px-2 py-0.5 bg-[#1e293b] hover:bg-[#334155] rounded text-slate-200">{t.zoomIn}</button>
                <button onClick={() => { setZoomLevel(1.0); setPanOffset({ x: 0, y: 0 }); }} className="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-400 ml-1">{t.zoomReset}</button>
              </div>

              {/* Scaled & Panned Canvas Viewport */}
              <div className="w-full h-full origin-top-left" style={{ transform: `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomLevel})` }}>
                {/* SVG Link Lines (z-0) */}
                <svg className="absolute inset-0 w-full h-full pointer-events-none overflow-visible z-0" style={{ overflow: 'visible' }}>
                  {Array.from(convergence.links.values()).map(link => {
                    const pA = convergence.ports.get(link.portAId);
                    const pB = convergence.ports.get(link.portBId);
                    if (!pA || !pB) return null;
                    const cA = getPortCoords(pA);
                    const cB = getPortCoords(pB);

                    const isDown = link.status === 'DOWN';
                    const isBlocked = pA.state === 'BLOCKING' || pA.state === 'DISCARDING' || pB.state === 'BLOCKING' || pB.state === 'DISCARDING';

                    const computedCost = getLinkCost(link.speed, costStandard);
                    const effectiveCost = (link.customCost !== undefined && link.customCost > 0) ? link.customCost : computedCost;
                    const isCustom = link.customCost !== undefined && link.customCost > 0;
                    const label = isDown ? 'DOWN' : `COST: ${effectiveCost.toLocaleString('tr-TR')}`;

                    return (
                      <g key={link.id} className="pointer-events-auto cursor-pointer" onDoubleClick={() => setInspectorLink(link)}>
                        <line x1={cA.x} y1={cA.y} x2={cB.x} y2={cB.y} stroke={isDown ? '#ef4444' : isBlocked ? '#f59e0b' : '#38bdf8'} strokeWidth={isDown ? 3.5 : 3} strokeDasharray={isDown ? '6 6' : isBlocked ? '8 6' : 'none'} />

                        <g transform={`translate(${(cA.x + cB.x) / 2}, ${(cA.y + cB.y) / 2})`}>
                          <rect x="-42" y="-10" width="84" height="20" rx="4" fill={isDown ? '#450a0a' : isBlocked ? '#451a03' : '#0f172a'} stroke={isDown ? '#f87171' : isBlocked ? '#f59e0b' : (isCustom ? '#f59e0b' : '#38bdf8')} strokeWidth="1.5" />
                          <text x="0" y="3" textAnchor="middle" fill={isDown ? '#fca5a5' : isBlocked ? '#fde68a' : (isCustom ? '#fde68a' : '#7dd3fc')} fontSize="9" fontFamily="JetBrains Mono" fontWeight="bold">{label}</text>
                        </g>
                      </g>
                    );
                  })}
                </svg>

                {/* Switch Nodes (z-10, 195px Width) */}
                {Array.from(convergence.switches.values()).map(sw => {
                  const isRoot = sw.id === convergence.rootSwitchId;
                  const swPorts = Array.from(convergence.ports.values()).filter(p => p.switchId === sw.id);

                  return (
                    <div
                      key={sw.id}
                      onMouseDown={(e) => {
                        e.stopPropagation();
                        if (wiringMode) {
                          setPortModalSwitchId(sw.id);
                        } else {
                          setDraggingId(sw.id);
                          setDragOffset({ x: (e.clientX - panOffset.x) / zoomLevel - sw.x, y: (e.clientY - panOffset.y) / zoomLevel - sw.y });
                        }
                      }}
                      onDoubleClick={(e) => { e.stopPropagation(); setInspectorSwitch(sw); }}
                      className={`absolute z-10 w-[195px] bg-[#111827] border-2 rounded-lg p-2.5 shadow-2xl cursor-grab ${isRoot ? 'border-amber-400 shadow-amber-950/50' : 'border-[#1f293d]'}`}
                      style={{ left: `${sw.x}px`, top: `${sw.y}px` }}
                    >
                      <div className="flex items-center justify-between pb-1 border-b border-[#1f293d]">
                        <span className="font-mono text-xs font-bold text-slate-100">{sw.name} {isRoot && <span className="text-amber-400">👑</span>}</span>
                        <div className="flex space-x-1">
                          <button onClick={(e) => { e.stopPropagation(); setInspectorSwitch(sw); }} className="text-slate-400 hover:text-cyan-300">⚙️</button>
                          <button onClick={(e) => { e.stopPropagation(); handleDeleteSwitch(sw.id); }} className="text-slate-400 hover:text-rose-400" title="Delete Switch">🗑️</button>
                        </div>
                      </div>

                      {/* Protocol Badge & Switch Metadata */}
                      <div className="text-[10px] font-mono text-slate-400 mt-1 space-y-0.5">
                        <div className="flex justify-between items-center bg-[#0b0f19] px-1 py-0.5 rounded border border-[#1f293d] mb-1">
                          <span className="text-[9px] text-slate-400">MODE:</span>
                          <span className="text-[9px] font-bold text-cyan-400">{protocolBadgeText}</span>
                        </div>
                        <div>PRI: <span className="text-amber-400 font-bold">{sw.priority}</span></div>
                        <div className="truncate">MAC: {sw.mac}</div>
                        <div className="text-cyan-400 font-bold">COST: {isRoot ? '0 (ROOT)' : sw.rootPathCost}</div>
                      </div>

                      {/* Spacious 2-Column Port Grid */}
                      <div className="grid grid-cols-2 gap-1.5 mt-2 pt-1 border-t border-[#1f293d]">
                        {swPorts.map(p => {
                          let roleBg = 'bg-slate-800 text-slate-300 border-slate-700';
                          let badgeText = p.role;

                          if (p.role === 'ROOT') {
                            roleBg = 'bg-emerald-950 text-emerald-300 border-emerald-600 font-bold';
                            badgeText = stpVersion === '802.1s' ? 'RP-M0' : 'RP';
                          } else if (p.role === 'DESIGNATED') {
                            roleBg = 'bg-cyan-950 text-cyan-300 border-cyan-600 font-bold';
                            badgeText = stpVersion === '802.1s' ? 'DP-M0' : 'DP';
                          } else if (p.role === 'ALTERNATE') {
                            roleBg = 'bg-amber-950 text-amber-300 border-amber-600 font-bold';
                            badgeText = stpVersion === '802.1D' ? 'BLK' : stpVersion === '802.1s' ? 'AP-M0' : 'DISC';
                          }

                          const isOccupied = Boolean(p.connectedLinkId);
                          const targetInfo = getConnectedTargetInfo(p);

                          return (
                            <div
                              key={p.id}
                              onClick={(e) => {
                                e.stopPropagation();
                                handleSelectPortInModal(p.id);
                              }}
                              className={`flex items-center justify-between px-1.5 py-1 rounded border cursor-pointer text-[9px] font-mono ${roleBg}`}
                              title={`${p.name} | ${isOccupied ? `KABLO BAĞLI (➡️ ${targetInfo})` : t.portAvailable} | Protocol: ${stpVersion} | Role: ${p.role}`}
                            >
                              <div className="flex items-center space-x-1 min-w-0 shrink-0">
                                <span className={`w-2 h-2 rounded-full border border-[#0b0f19] shrink-0 ${isOccupied ? 'bg-purple-500' : 'bg-sky-400 animate-pulse'}`} />
                                <span className="font-bold">{p.name}</span>
                              </div>
                              <span className="text-[8px] px-1 py-0.5 rounded bg-black/40 ml-1 shrink-0">[{badgeText}]</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}

                {/* Floating Cable Port Badges Overlay (z-20) */}
                <svg className="absolute inset-0 w-full h-full pointer-events-none overflow-visible z-20" style={{ overflow: 'visible' }}>
                  {Array.from(convergence.links.values()).map(link => {
                    const pA = convergence.ports.get(link.portAId);
                    const pB = convergence.ports.get(link.portBId);
                    if (!pA || !pB) return null;
                    const cA = getPortCoords(pA);
                    const cB = getPortCoords(pB);

                    const dx = cB.x - cA.x;
                    const dy = cB.y - cA.y;
                    const len = Math.hypot(dx, dy) || 1;
                    const ux = dx / len;
                    const uy = dy / len;

                    const offsetDist = Math.max(52, Math.min(len * 0.28, len * 0.38));

                    const portPosA = { x: cA.x + ux * offsetDist, y: cA.y + uy * offsetDist };
                    const portPosB = { x: cB.x - ux * offsetDist, y: cB.y - uy * offsetDist };

                    return (
                      <g key={`floating-proportional-badges-${link.id}`} className="pointer-events-auto">
                        <g transform={`translate(${portPosA.x}, ${portPosA.y})`} onClick={(e) => { e.stopPropagation(); setInspectorLink(link); }}>
                          <rect x="-22" y="-9" width="44" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" strokeWidth="1.5" className="shadow-xl" />
                          <text x="0" y="3" textAnchor="middle" fill="#38bdf8" fontSize="9.5" fontFamily="JetBrains Mono" fontWeight="bold">{pA.name}</text>
                        </g>

                        <g transform={`translate(${portPosB.x}, ${portPosB.y})`} onClick={(e) => { e.stopPropagation(); setInspectorLink(link); }}>
                          <rect x="-22" y="-9" width="44" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" strokeWidth="1.5" className="shadow-xl" />
                          <text x="0" y="3" textAnchor="middle" fill="#38bdf8" fontSize="9.5" fontFamily="JetBrains Mono" fontWeight="bold">{pB.name}</text>
                        </g>
                      </g>
                    );
                  })}
                </svg>
              </div>

              {/* Centered Port Selector Modal */}
              {portModalSwitchId && (
                <div
                  className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 font-mono text-xs"
                  onClick={() => setPortModalSwitchId(null)}
                >
                  <div
                    className="bg-[#111827] border-2 border-amber-400 shadow-2xl rounded-xl p-4 w-full max-w-md space-y-3"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <div className="flex justify-between items-center pb-2 border-b border-[#1f293d]">
                      <span className="font-bold text-amber-400 text-sm">{t.selectPortTitle}</span>
                      <button onClick={() => setPortModalSwitchId(null)} className="text-slate-400 hover:text-slate-200">✕</button>
                    </div>

                    <div className="space-y-2 max-h-64 overflow-y-auto">
                      {portsList.filter(p => p.switchId === portModalSwitchId).map(p => {
                        const isOccupied = Boolean(p.connectedLinkId);
                        const targetInfo = getConnectedTargetInfo(p);

                        return (
                          <div
                            key={p.id}
                            className={`p-2 rounded flex justify-between items-center text-xs border ${isOccupied ? 'bg-purple-950/50 border-purple-800 text-purple-200' : 'bg-slate-900 border-slate-700 text-slate-200 font-bold'}`}
                          >
                            <button
                              onClick={() => handleSelectPortInModal(p.id)}
                              className="flex items-center space-x-2 flex-1 text-left"
                            >
                              <span className={`w-2.5 h-2.5 rounded-full ${isOccupied ? 'bg-purple-400' : 'bg-sky-400'}`} />
                              <span className="text-sm font-bold">{p.name}</span>
                              {isOccupied ? (
                                <span className="text-[10px] font-bold text-purple-300 bg-purple-900/60 px-1.5 py-0.5 rounded border border-purple-700">➡️ {targetInfo}</span>
                              ) : (
                                <span className="text-[10px] uppercase font-bold text-sky-400">({t.portAvailable})</span>
                              )}
                            </button>

                            {isOccupied && (
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleDisconnectPort(p.id);
                                }}
                                className="px-2 py-1 bg-rose-900/80 hover:bg-rose-800 text-rose-100 border border-rose-700 rounded text-[10px] font-bold ml-2 shrink-0"
                              >
                                ✂️ {t.disconnectPort}
                              </button>
                            )}
                          </div>
                        );
                      })}

                      <button
                        onClick={() => {
                          const nextNum = portsList.filter(p => p.switchId === portModalSwitchId).length + 1;
                          const newPortId = `${portModalSwitchId}-p${nextNum}-${Date.now()}`;
                          const newPort = { id: newPortId, name: `Gi0/${nextNum}`, switchId: portModalSwitchId, priority: 128, portNumber: nextNum, role: 'DISABLED', state: 'DISABLED', connectedLinkId: null };
                          setPortsList(prev => [...prev, newPort]);
                          handleSelectPortInModal(newPortId);
                        }}
                        className="w-full text-center py-2 bg-emerald-950 text-emerald-300 border border-emerald-700 rounded font-bold text-xs mt-2"
                      >
                        {t.addNewPort}
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Right Side Panel */}
            <div className="w-[35%] h-full bg-[#111827] flex flex-col font-mono text-xs border-l border-[#1f293d]">
              <div className="h-10 bg-[#0d1322] border-b border-[#1f293d] flex items-center justify-between px-3">
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-cyan-400 uppercase tracking-wider text-xs">{t.syslogTrace}</span>
                  <span className="text-[10px] text-slate-500">({convergence.logs.length})</span>
                </div>
              </div>

              {/* Category Filter Buttons */}
              <div className="flex flex-wrap gap-1 px-2 py-1.5 bg-[#0d1322] border-b border-[#1f293d]">
                {['ALL', 'ENGINE', 'ROOT', 'COST', 'ROLE', 'LOOP', 'BLOCK', 'FAILOVER', 'ACTION', 'BPDU', 'TIMER'].map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setSyslogFilter(cat)}
                    className={`px-1.5 py-0.5 rounded text-[9px] font-bold border transition-colors ${syslogFilter === cat ? 'bg-cyan-600 text-white border-cyan-500' : 'text-slate-500 border-[#1f293d] hover:text-slate-300'}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div ref={logsContainerRef} className="flex-1 p-2 overflow-y-auto space-y-1 bg-[#0b0f19]">
                {convergence.logs
                  .filter(l => syslogFilter === 'ALL' || l.category === syslogFilter)
                  .map(l => (
                    <div key={l.id} className="p-1.5 rounded bg-[#111827] border border-[#1f293d] text-[11px] flex items-start space-x-1.5">
                      <span className="text-slate-500 text-[10px] shrink-0 pt-0.5">[{l.timestamp}]</span>
                      <span className={`text-[9px] px-1 py-0.5 rounded border uppercase font-bold shrink-0 ${l.category === 'ROOT' ? 'bg-amber-950 text-amber-300 border-amber-700' : l.category === 'ROLE' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : l.category === 'ACTION' ? 'bg-purple-950 text-purple-300 border-purple-700' : l.category === 'BPDU' ? 'bg-teal-950 text-teal-300 border-teal-700' : l.category === 'TIMER' ? 'bg-violet-950 text-violet-300 border-violet-700' : 'bg-cyan-950 text-cyan-300 border-cyan-700'}`}>
                        STP-{l.category}
                      </span>
                      <span className="text-slate-200">{lang === 'tr' ? l.messageTr : l.messageEn}</span>
                    </div>
                ))}
              </div>
            </div>
          </div>

          {/* Guided Tour Modal */}
          {isTourOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 font-mono text-xs z-50">
              <div className="bg-[#111827] border-2 border-amber-400 rounded-xl p-5 w-full max-w-xl space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-[#1f293d]">
                  <span className="font-bold text-amber-400 text-sm flex items-center space-x-2">
                    <span>🚀</span> <span>{t.helpTitle}</span>
                  </span>
                  <button onClick={() => setIsTourOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                </div>

                <div className="flex justify-between items-center text-xs text-slate-400">
                  <span className="font-bold text-cyan-400">{tourSteps[tourStep].title}</span>
                  <span>{tourStep + 1} / {tourSteps.length}</span>
                </div>

                <div className="bg-[#0b0f19] border border-[#1f293d] p-4 rounded text-slate-200 leading-relaxed">
                  {tourSteps[tourStep].desc}
                </div>

                <div className="flex justify-between items-center pt-2">
                  <button
                    onClick={() => setTourStep(Math.max(0, tourStep - 1))}
                    disabled={tourStep === 0}
                    className="px-3 py-1 bg-[#1e293b] hover:bg-[#334155] disabled:opacity-30 rounded font-bold"
                  >
                    {t.prevTourStep}
                  </button>

                  {tourStep < tourSteps.length - 1 ? (
                    <button
                      onClick={() => setTourStep(tourStep + 1)}
                      className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-bold"
                    >
                      {t.nextTourStep}
                    </button>
                  ) : (
                    <button
                      onClick={() => { setIsTourOpen(false); setTourStep(0); }}
                      className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold"
                    >
                      {t.finishTour}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Switch Inspector Modal */}
          {inspectorSwitch && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 font-mono text-xs z-50">
              <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-4 w-full max-w-md space-y-3">
                <div className="flex justify-between font-bold text-cyan-400 border-b border-[#1f293d] pb-2">
                  <span>{t.inspectorTitleSwitch}: {inspectorSwitch.name}</span>
                  <button onClick={() => setInspectorSwitch(null)}>✕</button>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">{t.priority} (Step 4096):</label>
                  <select
                    value={inspectorSwitch.priority}
                    onChange={(e) => {
                      const pri = Number(e.target.value);
                      setSwitchesList(prev => prev.map(s => s.id === inspectorSwitch.id ? { ...s, priority: pri } : s));
                      setInspectorSwitch({ ...inspectorSwitch, priority: pri });
                      addOperatorLog('ACTION', `Changed switch ${inspectorSwitch.name} priority to ${pri}.`, `${inspectorSwitch.name} anahtarının önceliği ${pri} olarak değiştirildi.`);
                    }}
                    className="w-full bg-[#0b0f19] border border-[#1f293d] text-amber-400 font-bold p-1 rounded"
                  >
                    {Array.from({ length: 16 }, (_, i) => i * 4096).map(pri => (
                      <option key={pri} value={pri}>{pri}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">{t.macAddress}:</label>
                  <input
                    type="text"
                    value={inspectorSwitch.mac}
                    onChange={(e) => {
                      const mac = e.target.value;
                      setSwitchesList(prev => prev.map(s => s.id === inspectorSwitch.id ? { ...s, mac } : s));
                      setInspectorSwitch({ ...inspectorSwitch, mac });
                    }}
                    className="w-full bg-[#0b0f19] border border-[#1f293d] p-1 rounded text-slate-100"
                  />
                </div>
                <div className="pt-2 flex justify-between">
                  <button onClick={() => { handleDeleteSwitch(inspectorSwitch.id); setInspectorSwitch(null); }} className="px-3 py-1 bg-rose-950 text-rose-300 border border-rose-700 rounded font-bold">🗑️ {t.deleteSwitch}</button>
                  <button onClick={() => setInspectorSwitch(null)} className="px-3 py-1 bg-cyan-600 text-white rounded font-bold">{t.save}</button>
                </div>
              </div>
            </div>
          )}

          {/* Full Link Inspector Modal */}
          {inspectorLink && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 font-mono text-xs z-50" onClick={() => setInspectorLink(null)}>
              <div className="bg-[#111827] border-2 border-cyan-400 shadow-2xl rounded-xl p-4 w-full max-w-md space-y-4" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between font-bold text-cyan-400 border-b border-[#1f293d] pb-2">
                  <span>{t.inspectorTitleLink}: {inspectorLink.id}</span>
                  <button onClick={() => setInspectorLink(null)}>✕</button>
                </div>

                {/* Active Protocol Banner */}
                <div className="flex items-center justify-between bg-[#0b0f19] px-2.5 py-1.5 rounded border border-[#1f293d]">
                  <span className="text-[10px] text-slate-400">🖧 Aktif Protokol:</span>
                  <span className="text-[10px] font-bold text-amber-400">{stpVersion} · {costStandard === 'long' ? 'Long 32-bit (802.1t)' : 'Short 16-bit (802.1D)'}</span>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-slate-300 font-bold">{t.linkStatus}:</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setModalLinkStatus('UP')}
                      className={`p-2 rounded border font-bold flex items-center justify-center space-x-1.5 transition-all ${
                        modalLinkStatus === 'UP' ? 'bg-emerald-950 border-emerald-500 text-emerald-300 ring-2 ring-emerald-500/40' : 'bg-[#0b0f19] border-[#1f293d] text-slate-400'
                      }`}
                    >
                      <span>🟢 {t.linkUp}</span>
                    </button>

                    <button
                      onClick={() => setModalLinkStatus('DOWN')}
                      className={`p-2 rounded border font-bold flex items-center justify-center space-x-1.5 transition-all ${
                        modalLinkStatus === 'DOWN' ? 'bg-rose-950 border-rose-500 text-rose-300 ring-2 ring-rose-500/40 animate-pulse' : 'bg-[#0b0f19] border-[#1f293d] text-slate-400'
                      }`}
                    >
                      <span>🔴 {t.linkDown}</span>
                    </button>
                  </div>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-slate-300 font-bold">{t.linkSpeed} ({stpVersion} Standardı):</label>
                  <select
                    value={modalLinkSpeed}
                    onChange={(e) => setModalLinkSpeed(e.target.value)}
                    className="w-full bg-[#0b0f19] border border-[#1f293d] text-slate-100 font-bold p-2 rounded"
                  >
                    {costStandard === 'short' ? (
                      <>
                        <option value="100G">100 Gbps (IEEE 802.3ba) ➡️ Path Cost: 1</option>
                        <option value="40G">40 Gbps (IEEE 802.3ba) ➡️ Path Cost: 1</option>
                        <option value="10G">10 Gbps (10G Ultra Fiber) ➡️ Path Cost: 2</option>
                        <option value="1G">1 Gbps (Gigabit Ethernet) ➡️ Path Cost: 4</option>
                        <option value="100M">100 Mbps (Fast Ethernet) ➡️ Path Cost: 19</option>
                        <option value="10M">10 Mbps (Standard Ethernet) ➡️ Path Cost: 100</option>
                      </>
                    ) : (
                      <>
                        <option value="100G">100 Gbps (IEEE 802.3ba) ➡️ Path Cost: 200</option>
                        <option value="40G">40 Gbps (IEEE 802.3ba) ➡️ Path Cost: 500</option>
                        <option value="10G">10 Gbps (10G Ultra Fiber) ➡️ Path Cost: 2.000</option>
                        <option value="1G">1 Gbps (Gigabit Ethernet) ➡️ Path Cost: 20.000</option>
                        <option value="100M">100 Mbps (Fast Ethernet) ➡️ Path Cost: 200.000</option>
                        <option value="10M">10 Mbps (Standard Ethernet) ➡️ Path Cost: 2.000.000</option>
                      </>
                    )}
                  </select>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-slate-300 font-bold">{t.customCost}:</label>
                  <input
                    type="number"
                    placeholder="e.g. 50 (Leave empty for default bandwidth cost)"
                    value={modalCustomCost}
                    onChange={(e) => setModalCustomCost(e.target.value)}
                    className="w-full bg-[#0b0f19] border border-[#1f293d] p-2 rounded text-amber-300 font-bold"
                  />
                </div>

                <div className="pt-3 border-t border-[#1f293d] flex justify-between items-center">
                  <button
                    onClick={() => {
                      handleDeleteLink(inspectorLink.id);
                      setInspectorLink(null);
                    }}
                    className="px-3 py-1.5 bg-rose-950 hover:bg-rose-900 text-rose-200 border border-rose-700 rounded font-bold"
                  >
                    🗑️ {t.deleteLink}
                  </button>

                  <button
                    onClick={() => {
                      setBpduModalLink(inspectorLink);
                      setInspectorLink(null);
                    }}
                    className="px-3 py-1.5 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-700 rounded font-bold"
                  >
                    📄 BPDU
                  </button>

                  <div className="flex space-x-2">
                    <button onClick={() => setInspectorLink(null)} className="px-3 py-1.5 bg-[#1e293b] text-slate-300 rounded font-bold">{t.cancel}</button>
                    <button onClick={handleSaveLinkModal} className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-bold">{t.save}</button>
                  </div>
                </div>
              </div>
            </div>
          )}
          {/* BPDU Viewer Modal */}
          {bpduModalLink && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 font-mono text-xs z-50" onClick={() => setBpduModalLink(null)}>
              <div className="bg-[#111827] border border-emerald-500/50 rounded-xl p-5 w-full max-w-lg space-y-3 shadow-2xl text-slate-200" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-[#1f293d] pb-2 font-bold text-emerald-400">
                  <span>📄 IEEE 802.1D BPDU Frame Inspector</span>
                  <button onClick={() => setBpduModalLink(null)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>
                <div className="space-y-2 bg-[#0b0f19] p-3 rounded border border-[#1f293d]">
                  <div className="flex justify-between border-b border-[#1f293d] pb-1"><span className="text-slate-400">Root Bridge ID:</span><span className="font-bold text-amber-400">{formatBridgeId(convergence.switches.get(convergence.rootSwitchId)?.priority || 32768, convergence.switches.get(convergence.rootSwitchId)?.mac || '00:00:00:00:00:00')}</span></div>
                  <div className="flex justify-between border-b border-[#1f293d] pb-1"><span className="text-slate-400">Root Path Cost:</span><span className="font-bold text-cyan-400">{bpduModalLink.customCost !== undefined ? bpduModalLink.customCost : getLinkCost(bpduModalLink.speed, costStandard)}</span></div>
                  <div className="flex justify-between border-b border-[#1f293d] pb-1"><span className="text-slate-400">Sender Switch:</span><span className="font-bold text-slate-200">{convergence.switches.get(bpduModalLink.switchAId)?.name || 'SW'}</span></div>
                  <div className="flex justify-between border-b border-[#1f293d] pb-1"><span className="text-slate-400">Max Age:</span><span className="font-bold text-slate-200">{stpTimers.maxAge}s</span></div>
                  <div className="flex justify-between border-b border-[#1f293d] pb-1"><span className="text-slate-400">Hello Time:</span><span className="font-bold text-slate-200">{stpTimers.helloTime}s</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Forward Delay:</span><span className="font-bold text-slate-200">{stpTimers.forwardDelay}s</span></div>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setBpduModalLink(null)} className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded">Kapat</button>
                </div>
              </div>
            </div>
          )}

          {/* STP Timers Modal */}
          {isTimersOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 font-mono text-xs z-50" onClick={() => setIsTimersOpen(false)}>
              <div className="bg-[#111827] border border-violet-500/50 rounded-xl p-5 w-full max-w-md space-y-4 shadow-2xl text-slate-200" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-[#1f293d] pb-2 font-bold text-violet-400">
                  <span>⏱️ STP Timers Configuration</span>
                  <button onClick={() => setIsTimersOpen(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>
                <div className="space-y-3">
                  <div>
                    <div className="flex justify-between mb-1"><span className="text-slate-300 font-bold">Max Age (6-40s):</span><span className="text-violet-400 font-bold">{stpTimers.maxAge}s</span></div>
                    <input type="range" min="6" max="40" value={stpTimers.maxAge} onChange={e => setStpTimers({ ...stpTimers, maxAge: Number(e.target.value) })} className="w-full accent-violet-500" />
                  </div>
                  <div>
                    <div className="flex justify-between mb-1"><span className="text-slate-300 font-bold">Hello Time (1-10s):</span><span className="text-violet-400 font-bold">{stpTimers.helloTime}s</span></div>
                    <input type="range" min="1" max="10" value={stpTimers.helloTime} onChange={e => setStpTimers({ ...stpTimers, helloTime: Number(e.target.value) })} className="w-full accent-violet-500" />
                  </div>
                  <div>
                    <div className="flex justify-between mb-1"><span className="text-slate-300 font-bold">Forward Delay (4-30s):</span><span className="text-violet-400 font-bold">{stpTimers.forwardDelay}s</span></div>
                    <input type="range" min="4" max="30" value={stpTimers.forwardDelay} onChange={e => setStpTimers({ ...stpTimers, forwardDelay: Number(e.target.value) })} className="w-full accent-violet-500" />
                  </div>
                </div>
                <div className="flex justify-end space-x-2 pt-2 border-t border-[#1f293d]">
                  <button onClick={() => setIsTimersOpen(false)} className="px-4 py-1.5 bg-violet-600 hover:bg-violet-500 text-white font-bold rounded">Tamam</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
